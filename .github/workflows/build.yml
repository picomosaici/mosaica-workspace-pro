# ===================================================================
# Mosaica Workspace Pro - Build & Release automatico
# ===================================================================
# Si attiva quando:
#  - si pubblica un tag git che inizia con "v" (es. v5.2026.0)
#    -> builda l'installer Windows + crea una GitHub Release
#  - si avvia manualmente dalla pagina "Actions" del repository
#    -> builda solo, senza creare release
# ===================================================================

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build installer Windows
    runs-on: windows-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci --omit=optional

      - name: Build installer Windows (x64)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Carica artifact (per ogni esecuzione)
        uses: actions/upload-artifact@v4
        with:
          name: MosaicaWorkspacePro-Installer
          path: dist/*.exe
          retention-days: 30

      - name: Crea GitHub Release (solo su tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          name: "Mosaica Workspace Pro ${{ github.ref_name }}"
          body: |
            ## 🎨 Mosaica Workspace Pro ${{ github.ref_name }}

            Le punte delle tessere si mozzano direttamente sulla tessera, e il lato curvo dei settori si abbassa o parte dritto.

            ### ✨ Novità

            - ✂️ **Spunta delle tessere** — con una tessera a lati dritti selezionata (triangolo, trapezio, quadrato, rettangolo, forma libera anche della Palladiana) premi ✂️ nel menu radiale: **clic su una punta** e la punta si mozza con un lato dritto nuovo (1 mm la prima volta), **trascinando** scegli quanto, i due **capi** del taglio si spostano lungo il loro lato. Larghezza e capi anche in mm nell'Ispettore, **Togli questo taglio** e **↺ Rimetti le punte**. La tessera **resta lei**: colore, texture, famiglia fantasma 👻, posizione, rotazione
            - ◠ **Curva dei settori** — sui settori del cerchio e dell'ovale, nell'Ispettore: **Curva %** abbassa il lato curvo verso la linea dritta fra i suoi capi (100 = l'arco di sempre, 0 = lato dritto) lasciando **identici i due lati dritti**; **Inizio / Fine curvatura** fanno partire il lato curvo dritto per N mm e curvare solo dopo, raccordato senza spigolo, con due pallini da trascinare sul settore
            - 🔪 **Tavola delle Tessere** — nella distinta ogni forma col suo nome: «triangolo spuntato», «trapezio spuntato», «quadrato spuntato», «rettangolo spuntato», «settore schiacciato» (curva in %), «settore sagomato» (tratti dritti in mm)

            ### 🐛 Correzioni

            - 🖊️ Il tasto **«Ripeti» della penna Wacom** non faceva niente (mandava Ctrl+Y): ora ripristina, come <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd>
            - ↷ Il pulsante Ripristina diceva «Ctrl+Y»: il tasto giusto è <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd>
            - ⌨️ Nei campi in mm della spunta, <kbd>Esc</kbd> rimette il numero di prima
            - 📖 Guida utente IT/EN aggiornata, con un capitolo nuovo

            ### 📥 Installazione

            1. Scarica il file `MosaicaWorkspacePro-Setup-11.2026.exe` qui sotto
            2. Eseguilo (se Windows mostra *"Editore sconosciuto"*, clicca **Ulteriori informazioni → Esegui comunque**)
            3. Segui l'installer — puoi scegliere la lingua all'avvio

            > 💡 Tavole salvate, calibrazioni e preferenze vengono **conservate** durante l'aggiornamento.

            ### 📝 Note tecniche

            - Versione interna: `11.2026.0`
            - Fabric.js 5.5.2; nessuna dipendenza nuova
            - I progetti salvati con le versioni precedenti si aprono normalmente; aperti con una versione vecchia, le tessere spuntate si vedono giuste e i settori curvati tornano interi
