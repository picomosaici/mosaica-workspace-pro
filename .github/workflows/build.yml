# ===================================================================
# Mosaica Workspace Pro - Build & Release automatico
# ===================================================================
# Si attiva quando:
#  - si pubblica un tag git che inizia con "v" (es. v5.2026.0)
#    -> builda l'installer Windows + crea una GitHub Release
#  - si avvia manualmente dalla pagina "Actions" del repository
#    -> builda solo, senza creare release
# ===================================================================

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build installer Windows
    runs-on: windows-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci --omit=optional

      - name: Build installer Windows (x64)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Carica artifact (per ogni esecuzione)
        uses: actions/upload-artifact@v4
        with:
          name: MosaicaWorkspacePro-Installer
          path: dist/*.exe
          retention-days: 30

      - name: Crea GitHub Release (solo su tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          name: "Mosaica Workspace Pro ${{ github.ref_name }}"
          body: |
            ## 🎨 Mosaica Workspace Pro ${{ github.ref_name }}

            Grande aggiornamento: dalla tavola al taglio laser.

            ### ✨ Novità

            - 🔪 **Tavola delle Tessere** (menu Esporta) — prepara i file per il taglio laser: SVG separati per famiglia di colore, compensazione del taglio e linguette, PDF per il banco di lavoro e distinta delle tessere in CSV
            - 🖼️ **Pennello Timbro** — copia una zona del lavoro e la ristampa dove dipingi; punta con forma, misura, spaziatura e rotazione regolabili, anche con una forma libera disegnata col costruttore della palladiana
            - ⬚ **Comandi della selezione** nel menu radiale — deseleziona, ▣ inquadra la selezione, ◨ ⬓ specchio orizzontale e verticale (anche sulle tessere ruotate, senza mai cambiare le misure)
            - ⬡ **Perimetro di contenimento** — ora si corregge con le maniglie, e la lente mirino (tasto **L**) aiuta a piazzare i vertici con precisione
            - 🖌️ **Nuove punte pennello**

            ### 🛠️ Miglioramenti e correzioni

            - 💧 Acquerello: l'anello attorno al cursore è misurato sulla punta vera
            - 🎯 Menu radiale in colonna quando non c'è spazio; misure L/A sempre visibili
            - 🖱️ Tasto destro in multi-selezione: prende sempre la forma giusta a qualsiasi zoom
            - 📏 Calibrazione dello schermo: ripeterla dà sempre il fattore giusto
            - 🚀 Ogni strumento si accende al primo clic
            - 📦 Installazioni nuove: pennelli e carta dell'acquerello di nuovo inclusi nell'installer

            ### 📥 Installazione

            1. Scarica il file `MosaicaWorkspacePro-Setup-09.2026.exe` qui sotto
            2. Eseguilo (se Windows mostra *"Editore sconosciuto"*, clicca **Ulteriori informazioni → Esegui comunque**)
            3. Segui l'installer — puoi scegliere la lingua all'avvio

            > 💡 Tavole salvate, calibrazioni e preferenze vengono **conservate** durante l'aggiornamento. I progetti salvati con le versioni precedenti si aprono normalmente.

            ### 📝 Note tecniche

            - Versione interna: `9.2026.0`
            - Electron 41 · Fabric.js 5.1.0 → 5.3.0 · 900 chiavi di traduzione simmetriche IT + EN
