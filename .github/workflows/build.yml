# ===================================================================
# Mosaica Workspace Pro - Build & Release automatico
# ===================================================================
# Si attiva quando:
#  - si pubblica un tag git che inizia con "v" (es. v5.2026.0)
#    -> builda l'installer Windows + crea una GitHub Release
#  - si avvia manualmente dalla pagina "Actions" del repository
#    -> builda solo, senza creare release
# ===================================================================

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build installer Windows
    runs-on: windows-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci --omit=optional

      - name: Build installer Windows (x64)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Carica artifact (per ogni esecuzione)
        uses: actions/upload-artifact@v4
        with:
          name: MosaicaWorkspacePro-Installer
          path: dist/*.exe
          retention-days: 30

      - name: Crea GitHub Release (solo su tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          name: "Mosaica Workspace Pro ${{ github.ref_name }}"
          body: |
            ## 🎨 Mosaica Workspace Pro ${{ github.ref_name }}

            Correzione della 10.2026: le texture fantasma tornano col colore che hai scelto, e la ruota dei colori parte dal colore della tessera.

            ### 🐛 Correzioni

            - 👻 **Texture fantasma, il colore** — mostrando la famiglia, le tessere rimaste del colore di lavoro (quello della capostipite dopo **Fantasma**) prendono il **colore dato alla texture con la ruota**; quelle ricolorate a mano tengono il loro. Prima tutte prendevano il colore di lavoro (per esempio il blu della tessera nuova)
            - 🔁 **I progetti fatti con la 10.2026 si rimettono a posto da soli**: nascondi e mostra la famiglia (il colore della famiglia è scritto in ogni tessera)
            - 🎨 **La ruota parte dal colore della tessera**, anche con una texture (la sua tinta, o il colore medio della texture); con più tessere dal loro colore se è più o meno lo stesso, altrimenti dall'ultimo usato. Prima partiva sempre da un azzurro fisso
            - 👻 **Fantasma** su tessere di una famiglia mostrata tiene il colore dato con la ruota
            - 📖 Guida utente IT/EN aggiornata

            ### 📥 Installazione

            1. Scarica il file `MosaicaWorkspacePro-Setup-10.2026.exe` qui sotto
            2. Eseguilo (se Windows mostra *"Editore sconosciuto"*, clicca **Ulteriori informazioni → Esegui comunque**)
            3. Segui l'installer — puoi scegliere la lingua all'avvio

            > 💡 Tavole salvate, calibrazioni e preferenze vengono **conservate** durante l'aggiornamento.

            ### 📝 Note tecniche

            - Versione interna: `10.2026.1`
            - Fabric.js 5.5.2; nessuna dipendenza nuova
            - I progetti salvati con le versioni precedenti si aprono normalmente
