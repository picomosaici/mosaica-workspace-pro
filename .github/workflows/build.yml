# ===================================================================
# Mosaica Workspace Pro - Build & Release automatico
# ===================================================================
# Si attiva quando:
#  - si pubblica un tag git che inizia con "v" (es. v5.2026.0)
#    -> builda l'installer Windows + crea una GitHub Release
#  - si avvia manualmente dalla pagina "Actions" del repository
#    -> builda solo, senza creare release
# ===================================================================

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build installer Windows
    runs-on: windows-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci --omit=optional

      - name: Build installer Windows (x64)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Carica artifact (per ogni esecuzione)
        uses: actions/upload-artifact@v4
        with:
          name: MosaicaWorkspacePro-Installer
          path: dist/*.exe
          retention-days: 30

      - name: Crea GitHub Release (solo su tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          name: "Mosaica Workspace Pro ${{ github.ref_name }}"
          body: |
            ## 🎨 Mosaica Workspace Pro ${{ github.ref_name }}

            La penna impara le punte, l'acquerello ha un set di punte nuovo e il foglio non si gira più a lavoro iniziato.

            ### ✨ Novità

            - ✏️ **Penna con le punte** — oltre alla punta tonda di sempre, la penna può usare una punta disegnata (PNG), come l'acquerello: pennini, grafite, carboncino, gessetto. Il tratto resta **vettoriale**: nitido a ogni zoom, leggero da salvare, si cancella e si annulla come gli altri. Nell'Ispettore: **Punta**, **Distanza**, **Rotazione iniziale** e **Direzione** (la punta segue il tratto)
            - 🖋️ **Sei punte per la penna**: tonda morbida, pennino a punta, pennino piatto, grafite, carboncino, gessetto. Le tue si aggiungono con il pulsante **📁 Apri la cartella delle punte**
            - 💧 **Nuovo set di 11 punte per l'acquerello**, fatte apposta: tonda morbida e asciutta, piatta, lingua di gatto, bordo bagnato, bordo sfumato, nuvola, granulazione, spugna, schizzi e la punta di base rifatta

            ### 🔧 Miglioramenti

            - 🔒 **Orientamento del foglio**: a lavoro iniziato (un tratto oppure due tessere) i pulsanti Verticale e Orizzontale non girano più il foglio e lo dicono — girarlo a metà lavoro spostava le tessere e deformava gli acquerelli
            - 🖱️ **Penna col mouse**: il tratto è largo quanto la Larghezza e quanto l'anello (prima era il 70%). I tratti già fatti non cambiano
            - 🖊️ **Tavoletta Wacom**: curva di pressione e sensibilità arrivano al tratto finito, che non cambia più spessore quando alzi la penna
            - 🔄 **Punte aggiornate da sole**: le punte di Mosaica si aggiornano e le 66 vecchie si tolgono; le punte aggiunte da te con altri nomi non si toccano mai
            - ⚙️ **Impostazioni di penna e acquerello**: quelle del progetto hanno la precedenza e tutti gli slider tornano come li avevi lasciati

            ### 🐛 Correzioni

            - Acquerello con una punta che su questo computer non c'è: prima i tratti erano invisibili, ora usa la punta di base e avvisa
            - Cambiare la punta dell'acquerello non lascia più un Ctrl+Z "a vuoto"

            ### 📥 Installazione

            1. Scarica il file `MosaicaWorkspacePro-Setup-09.2026.exe` qui sotto
            2. Eseguilo (se Windows mostra *"Editore sconosciuto"*, clicca **Ulteriori informazioni → Esegui comunque**)
            3. Segui l'installer — puoi scegliere la lingua all'avvio

            > 💡 Tavole salvate, calibrazioni e preferenze vengono **conservate** durante l'aggiornamento. Le punte che hai aggiunto tu restano; gli acquerelli già dipinti non cambiano.

            ### 📝 Note tecniche

            - Versione interna: `9.2026.2`
            - Esporta disegno mano libera (SVG): i tratti fatti con una punta escono come immagine del tratto, come l'acquerello
            - I progetti salvati con le versioni precedenti si aprono normalmente
