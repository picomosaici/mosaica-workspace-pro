# ===================================================================
# Mosaica Workspace Pro - Build & Release automatico
# ===================================================================
# Si attiva quando:
#  - si pubblica un tag git che inizia con "v" (es. v5.2026.0)
#    -> builda l'installer Windows + crea una GitHub Release
#  - si avvia manualmente dalla pagina "Actions" del repository
#    -> builda solo, senza creare release
# ===================================================================

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build installer Windows
    runs-on: windows-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci --omit=optional

      - name: Build installer Windows (x64)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Carica artifact (per ogni esecuzione)
        uses: actions/upload-artifact@v4
        with:
          name: MosaicaWorkspacePro-Installer
          path: dist/*.exe
          retention-days: 30

      - name: Crea GitHub Release (solo su tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          name: "Mosaica Workspace Pro ${{ github.ref_name }}"
          body: |
            ## 🎨 Mosaica Workspace Pro ${{ github.ref_name }}

            Tre cantieri in una release: le texture fantasma per i mosaici grandi, i colori che arrivano giusti in copisteria e un perimetro che si mira al centesimo di millimetro e sa fare le curve.

            ### ✨ Novità

            - 👻 **Texture fantasma** — metti la texture una volta sola su una tessera e premi **Fantasma**: la texture si nasconde, e le copie, i cambi di forma e i settori se la portano dietro senza mostrarla. Con **Mostra la famiglia** compare su tutte, ognuna tinta col suo colore; con **Nascondi** tornano ai loro colori. Pensata per i mosaici da 1600 tessere e più
            - 🖨️ **Prova di stampa** — un velo mostra a video come uscirà il foglio dal plotter (FOGRA39 o ISO Coated v2 300%), con la carta simulata e i colori fuori stampa segnati a righe. Il disegno e i file non cambiano
            - 📄 **Esporta per la stampa** — il foglio intero a 300 DPI in **PDF/X-4** (consigliato per la copisteria), **PDF/X-1a** già in CMYK o PNG compatibile Adobe RGB (1998)
            - 🎨 **Ruota dei colori nuova** — anello e quadrato, HEX/RGB/**CMYK**, il colore «in stampa» accanto a quello «a video», l'avviso ⚠ fuori stampa e **Portalo in stampa**
            - 🎯 **Contagocce** — prende il colore di un punto del foglio (Shift+clic = la media dei pixel attorno)
            - ✏️ **La ruota anche per penna e acquerello** — la Tinta dell'Ispettore apre la ruota coi CMYK e il contagocce
            - 🧾 **Profili di stampa** — liberi nell'installer; quelli già installati sul PC si trovano da soli, gli altri si aggiungono
            - ⬡ **Perimetro con le curve** — punti morbidi (maniglia tonda: Shift+tap, M o doppio clic) e archi (si tira il rombo a metà lato)
            - 🔍 **Perimetro, la mira** — con la lente, tenendo premuto, la mano si demoltiplica e il punto si porta piano; al rilascio il mirino non salta. Le frecce spostano il punto di 0,1 mm (Shift 1 mm, Ctrl 0,01 mm)

            ### 🔧 Miglioramenti

            - 🧱 La copia di una tessera con texture non colorata ha la stessa texture e la stessa grana (prima nasceva grigia)
            - ⚡ Texture colorate: annulla, ripristina, incolla e riapertura dei mosaici grandi molto più veloci
            - 🏷️ **PNG completo** con l'etichetta sRGB: in copisteria non viene più scambiato per Adobe RGB
            - 🎯 Perimetro: il punto va dove premi, e con la lente le prese si misurano nel vetro
            - 📖 Guida utente con i capitoli nuovi «Texture e texture fantasma» e «Colore e stampa»

            ### 🐛 Correzioni

            - La texture non colorata ricolorata con la ruota non torna più fuori da sola dopo un Ctrl+Z o una riapertura
            - Cambia forma e Dividi cerchio non perdono più la texture al Ctrl+Z; i settori hanno ognuno la sua grana
            - Il colore di prima della texture si ritrova anche dopo un Ctrl+Z o una riapertura

            ### 📥 Installazione

            1. Scarica il file `MosaicaWorkspacePro-Setup-10.2026.exe` qui sotto
            2. Eseguilo (se Windows mostra *"Editore sconosciuto"*, clicca **Ulteriori informazioni → Esegui comunque**)
            3. Segui l'installer — puoi scegliere la lingua all'avvio

            > 💡 Tavole salvate, calibrazioni e preferenze vengono **conservate** durante l'aggiornamento. Per la prova di stampa fedele serve un monitor calibrato.

            ### 📝 Note tecniche

            - Versione interna: `10.2026.0`
            - Fabric.js 5.5.2; motore colore Little CMS 2 (lcms-wasm, MIT) dentro Mosaica, nessuna dipendenza npm nuova
            - I progetti salvati con le versioni precedenti si aprono normalmente. Un progetto con texture fantasma o perimetro curvo si apre anche con una versione vecchia, ma se quella lo risalva famiglie e maniglie morbide si perdono
